[project]
name = "buzzcrew-api"
version = "0.1.0"
description = "The Buzz Crew website API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "sqlmodel>=0.0.24",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "httpx>=0.28",
    "resend>=2.5",
    "structlog>=24.4",
    "jinja2>=3.1",
    "pwdlib[argon2]>=0.3.1",
    "typer>=0.27.2",
    "pillow>=12.3.0",
    "cloudinary>=1.46.2",
    "python-slugify>=9.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pgserver>=0.1.4",
    "uvicorn>=0.32",
    "pyyaml>=6.0.3",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/**" = ["E501"]

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
