<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f6f7;font-family:Arial,Helvetica,sans-serif;color:#0b0c1e;">

      <tr>
        <td style="padding:24px;font-size:15px;line-height:1.5;">
          <h1 style="margin:0 0 12px;font-size:20px;">Sign-in temporarily blocked</h1>
          <p>Hi {{ name }}, there were several failed attempts to sign in to your Buzz Crew admin account, so sign-in is blocked for 15 minutes.</p>

      </tr>
    </table>
