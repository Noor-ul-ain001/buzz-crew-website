<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f6f7;font-family:Arial,Helvetica,sans-serif;color:#0b0c1e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:12px;">
      <tr>
        <td style="padding:24px;font-size:15px;line-height:1.5;">
          <h1 style="margin:0 0 12px;font-size:20px;">Your password was changed</h1>
          <p>Hi {{ name }}, the password for your Buzz Crew admin account was just changed, and you've been signed out on your other devices.</p>
          <p>If this wasn't you, reset your password at <a href="{{ web_url }}/admin/forgot-password">{{ web_url }}/admin/forgot-password</a> and tell an admin straight away.</p>
          <p style="margin:24px 0 0;font-size:13px;color:#555;">— The Buzz Crew</p>
        </td>
      </tr>
    </table>
  </body>
</html>
