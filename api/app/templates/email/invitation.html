<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f6f7;font-family:Arial,Helvetica,sans-serif;color:#0b0c1e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:12px;">
      <tr>
        <td style="padding:24px;font-size:15px;line-height:1.5;">
          <h1 style="margin:0 0 12px;font-size:20px;">You're invited to The Buzz Crew admin</h1>
          <p>Hi {{ name }}, you've been invited to join the team as <strong>{{ role }}</strong>. Set your password to activate your account.</p>
<p style="margin:20px 0;"><a href="{ link }" style="display:inline-block;background:#f5cb42;color:#0b0c1e;padding:12px 20px;border-radius:999px;font-weight:bold;text-decoration:none;">Set your password</a></p>
          <p style="font-size:13px;color:#555;">This link works once and expires in 72 hours. If you weren't expecting it, you can ignore this email.</p>
          <p style="margin:24px 0 0;font-size:13px;color:#555;">— The Buzz Crew</p>
        </td>
      </tr>
    </table>
  </body>
</html>
