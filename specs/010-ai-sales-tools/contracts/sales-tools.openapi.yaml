openapi: 3.1.0
info:
  title: The Buzz Crew API — AI sales tools & estimator (010)
  version: 1.0.0
  description: >
    There is intentionally NO endpoint that sends a proposal anywhere (contract test asserts this).
paths:
  /api/v1/leads:
    post:
      description: >
        Feature 001 endpoint — extended: optional `estimate: { selections: [{service, scope}] }`.
        The server recalculates from current price ranges, stores the snapshot and sets
        source=cost_estimator.
  /api/v1/leads/{id}/post-process:
    post:
      operationId: postProcessLead
      description: >
        DEPLOYMENT D4: fired by the browser without waiting, right after a lead is created (any
        source), in its own function invocation. Runs Groq priority scoring. Requires the one-time
        post_process_token from the create response; idempotent; expires after 10 minutes.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        '202': { description: Scored or already scored (no data returned to the visitor) }
        '403': { description: Invalid or expired token }
  /api/v1/admin/leads/{id}/priority:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getLeadPriority
      x-required-role: admin
      responses:
        '200':
          description: Suggestion and admin override
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion:
                    type: object
                    properties:
                      status: { type: string, enum: [pending, done, failed] }
                      priority: { type: [string, 'null'], enum: [hot, warm, cold, null] }
                      reason: { type: [string, 'null'], maxLength: 120 }
                      generated_at: { type: [string, 'null'], format: date-time }
                      ai_generated: { const: true }
                  admin_priority: { type: [string, 'null'], enum: [hot, warm, cold, null] }
                  admin_priority_set_by: { type: [string, 'null'] }
                  effective_priority: { type: [string, 'null'], enum: [hot, warm, cold, null] }
        '403': { description: Editors refused }
    put:
      operationId: setAdminPriority
      x-required-role: admin
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [priority], properties: { priority: { type: [string, 'null'], enum: [hot, warm, cold, null] } } } } } }
      responses: { '200': { description: 'Override set/cleared; lead status unchanged' } }
  /api/v1/admin/leads/{id}/priority/refresh:
    post: { operationId: refreshLeadPriority, x-required-role: admin, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '202': { description: Re-scoring scheduled } } }
  /api/v1/admin/leads/{id}/proposals:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { operationId: listProposals, x-required-role: admin, responses: { '200': { description: 'All drafts and approved proposals for the lead' } } }
    post:
      operationId: createProposal
      x-required-role: admin
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [origin], properties: { origin: { type: string, enum: [ai, template] } } } } } }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
        '422': { description: 'ai_output_invalid — offer template' }
        '503': { description: 'ai_unavailable — clear message; template option available' }
  /api/v1/admin/proposals/{proposal_id}:
    parameters: [{ name: proposal_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { operationId: getProposal, x-required-role: admin, responses: { '200': { description: Proposal (with stale_case_study_ids) } } }
    patch:
      operationId: updateProposal
      x-required-role: admin
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body_md, version], properties: { body_md: { type: string }, version: { type: integer } } } } } }
      responses:
        '200': { description: Saved }
        '409': { description: 'version_conflict | already_approved' }
  /api/v1/admin/proposals/{proposal_id}/approve:
    post:
      operationId: approveProposal
      x-required-role: admin
      parameters: [{ name: proposal_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirm_reviewed], properties: { confirm_reviewed: { const: true } } } } } }
      responses:
        '200': { description: Approved; approved_by/at recorded }
        '409': { description: 'placeholders_remaining — { placeholders: [..] }' }
  /api/v1/admin/proposals/{proposal_id}/export:
    get:
      operationId: exportProposal
      x-required-role: admin
      parameters:
        - { name: proposal_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [pdf, docx, md] } }
      responses:
        '200': { description: File download (branded) }
        '403': { description: 'not_approved' }
  /api/v1/public/pricing:
    get:
      operationId: publicPricing
      responses:
        '200':
          description: Admin-configured ranges (no AI)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    service: { type: string }
                    billing_type: { type: string, enum: [monthly, one_off] }
                    scopes: { type: array, items: { type: object, properties: { scope: { type: string, enum: [starter, growth, premium] }, includes: { type: string }, min_pkr: { type: [integer, 'null'] }, max_pkr: { type: [integer, 'null'] } } } }
  /api/v1/tools/estimate:
    post:
      operationId: calculateEstimate
      parameters: [{ name: X-Visitor-Id, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [selections], properties: { selections: { type: array, minItems: 1, maxItems: 5, items: { type: object, required: [service, scope], properties: { service: { type: string }, scope: { type: string, enum: [starter, growth, premium] } } } } } } } } }
      responses:
        '200': { description: '{ lines: [{service, scope, includes, min, max, billing_type, price_on_request}], monthly: {min,max}, one_off: {min,max}, note }' }
        '429': { description: 'limit_reached — { reset_at }' }
  /api/v1/tools/captions:
    post:
      operationId: generateCaptions
      parameters: [{ name: X-Visitor-Id, in: header, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_type, goal, turnstile_token]
              properties:
                business_type: { type: string, minLength: 2, maxLength: 100 }
                goal: { type: string, enum: [awareness, sales, visits, engagement, launch] }
                platform: { type: string, enum: [instagram, facebook, linkedin, tiktok] }
                tone: { type: string, enum: [friendly, professional, playful] }
                turnstile_token: { type: string }
      responses:
        '200':
          description: Ideas, or a polite decline (still counted)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ideas, remaining_today, ai_generated]
                    properties:
                      ideas:
                        type: array
                        minItems: 5
                        maxItems: 5
                        items: { type: object, required: [idea, caption, hashtags], properties: { idea: { type: string }, caption: { type: string }, hashtags: { type: array, maxItems: 8, items: { type: string } } } }
                      remaining_today: { type: integer }
                      ai_generated: { const: true }
                  - type: object
                    required: [declined, message, remaining_today]
                    properties: { declined: { const: true }, message: { type: string }, remaining_today: { type: integer } }
        '400': { description: 'unsupported_language | bot_check_failed' }
        '429': { description: 'limit_reached — { reset_at }' }
        '503': { description: 'unavailable (provider error, timeout or site-wide cap) — not counted' }
  /api/v1/admin/pricing:
    get: { operationId: getPricingAdmin, x-required-role: admin, responses: { '200': { description: Full grid } } }
    put:
      operationId: updatePricing
      x-required-role: admin
      responses:
        '200': { description: Saved; history recorded; revalidation triggered }
        '422': { description: 'Field errors keyed service.scope.field (min > max, negative, non-integer)' }
  /api/v1/admin/pricing/history:
    get: { operationId: pricingHistory, x-required-role: admin, responses: { '200': { description: 'Change records (who, field, old → new, when)' } } }
components:
  schemas:
    Proposal:
      type: object
      required: [id, lead_id, status, origin, body_md, version, placeholders, created_at]
      properties:
        id: { type: string, format: uuid }
        lead_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, approved] }
        origin: { type: string, enum: [ai, template] }
        body_md: { type: string }
        version: { type: integer }
        placeholders: { type: array, items: { type: string }, description: 'Remaining [[TO CONFIRM: …]] items' }
        stale_case_study_ids: { type: array, items: { type: string, format: uuid } }
        approved_by: { type: [string, 'null'] }
        approved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
