openapi: 3.1.0
info:
  title: The Buzz Crew API — Auth & Users (003)
  version: 1.0.0
  description: >
    Session cookie `bc_session` (HttpOnly, Secure, SameSite=Lax). Unsafe methods require an
    allowlisted Origin header. 401 = no valid session; 403 = insufficient role or CSRF failure.
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: bc_session }
  schemas:
    Role: { type: string, enum: [admin, editor] }
    UserStatus: { type: string, enum: [invited, active, deactivated] }
    Me:
      type: object
      required: [id, email, name, role, session_expires_at, idle_expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        session_expires_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, email, name, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        last_login_at: { type: [string, 'null'], format: date-time }
        invitation_expires_at: { type: [string, 'null'], format: date-time }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    NewPassword:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 32 }
        password: { type: string, minLength: 12, maxLength: 128 }
    ErrorDetail:
      type: object
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_credentials, too_many_attempts, not_authenticated, forbidden, csrf_failed,
                      invalid_or_expired_token, weak_password, user_exists, last_admin, rate_limited]
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
  responses:
    Unauthorized: { description: No valid session, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorDetail' } } } }
    Forbidden: { description: Role or CSRF check failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorDetail' } } } }
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Signed in; sets bc_session, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { description: 'Generic invalid_credentials (unknown email, wrong password, deactivated — indistinguishable)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorDetail' } } } }
        '429': { description: too_many_attempts (per-account or per-IP block), headers: { Retry-After: { schema: { type: integer } } } }
  /api/v1/auth/logout:
    post: { operationId: logout, security: [{ session: [] }], responses: { '204': { description: Session ended; cookie cleared } } }
  /api/v1/auth/me:
    get:
      operationId: me
      security: [{ session: [] }]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/session/extend:
    post:
      operationId: extendSession
      security: [{ session: [] }]
      responses:
        '200': { description: Idle timer reset (absolute 12 h limit unchanged), content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      security: [{ session: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 12, maxLength: 128 } } } } } }
      responses:
        '204': { description: Changed; other sessions ended; confirmation email sent }
        '400': { description: weak_password or invalid_credentials }
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
      responses:
        '202': { description: 'Always the same response, whether or not an active account exists' }
        '429': { description: rate_limited (5 per email per hour) }
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewPassword' } } } }
      responses:
        '204': { description: Password set; all sessions ended; confirmation email sent }
        '400': { description: invalid_or_expired_token or weak_password }
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewPassword' } } } }
      responses:
        '200': { description: Account active; signed in (sets bc_session), content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { description: invalid_or_expired_token or weak_password }
  /api/v1/users:
    get:
      operationId: listUsers
      security: [{ session: [] }]
      x-required-role: admin
      responses:
        '200': { description: All team accounts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/invitations:
    post:
      operationId: inviteUser
      security: [{ session: [] }]
      x-required-role: admin
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, name, role], properties: { email: { type: string, format: email }, name: { type: string, maxLength: 100 }, role: { $ref: '#/components/schemas/Role' } } } } } }
      responses:
        '201': { description: Invited; email sent, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { description: user_exists }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/users/{user_id}:
    patch:
      operationId: updateUser
      security: [{ session: [] }]
      x-required-role: admin
      parameters: [{ name: user_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { $ref: '#/components/schemas/Role' }
                status: { type: string, enum: [active, deactivated] }
      responses:
        '200': { description: Updated; deactivation ends all sessions immediately, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { description: last_admin }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/users/{user_id}/invitation:
    post:
      operationId: resendInvitation
      security: [{ session: [] }]
      x-required-role: admin
      parameters: [{ name: user_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '202': { description: New link sent; previous link cancelled } }
    delete:
      operationId: cancelInvitation
      security: [{ session: [] }]
      x-required-role: admin
      parameters: [{ name: user_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Invitation cancelled } }
