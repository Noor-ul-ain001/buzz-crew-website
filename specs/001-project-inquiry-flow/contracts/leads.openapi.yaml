openapi: 3.1.0
info:
  title: The Buzz Crew API — Leads (001)
  version: 1.0.0
paths:
  /api/v1/leads:
    post:
      operationId: createLead
      summary: Submit a project inquiry (public)
      description: >
        Stores the lead with status `new`, then sends the
        team notification and client confirmation inline before responding (5 s timeout each; DEPLOYMENT D4). Email failure never
        changes the response. Repeating a request with the same `idempotency_key`
        returns the original lead without sending emails again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadCreate' }
      responses:
        '201':
          description: Lead stored (or already stored for this idempotency key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadCreated' }
        '422':
          description: Validation error (FastAPI standard shape; one entry per invalid field)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPValidationError' }
        '429':
          description: Too many submissions from this visitor
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until retry is allowed }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDetail' }
              example: { detail: { code: rate_limited, message: "Too many attempts, please try again later." } }
  /api/health:
    get:
      operationId: health
      summary: Liveness
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }
  /api/health/ready:
    get:
      operationId: ready
      summary: Readiness (checks database connectivity)
      responses:
        '200': { description: Ready }
        '503': { description: Database unreachable }
components:
  schemas:
    Country: { type: string, enum: [pakistan, uae, uk, other] }
    Service: { type: string, enum: [digital_marketing, creative_design, web_software, ui_ux_design, video_content, public_relations, branding, copywriting, ai_automation, iot_smart] }
    BudgetRange: { type: string, enum: [under_50k, 50k_150k, 150k_plus, not_sure] }
    LeadCreate:
      type: object
      additionalProperties: false
      required: [name, email, country, services, budget_range, message, source_page, idempotency_key]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, 'null'], pattern: '^\+?[\d\s()-]{7,20}$' }
        business: { type: [string, 'null'], maxLength: 150 }
        country: { $ref: '#/components/schemas/Country' }
        services:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Service' }
        budget_range: { $ref: '#/components/schemas/BudgetRange' }
        message: { type: string, minLength: 10, maxLength: 2000 }
        source_page: { type: string, maxLength: 200, pattern: '^/' , description: Path only, no query string }
        idempotency_key: { type: string, format: uuid }
        website: { type: [string, 'null'], description: Honeypot; must be empty or absent }
    LeadCreated:
      type: object
      required: [id, status, created_at, post_process_token]
      properties:
        post_process_token: { type: string, description: 'One-time token for POST /api/v1/leads/{id}/post-process (feature 010 lead scoring; DEPLOYMENT D4)' }
        id: { type: string, format: uuid }
        status: { type: string, const: new }
        created_at: { type: string, format: date-time }
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bot_check_failed, rate_limited] }
            message: { type: string }
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc: { type: array, items: { anyOf: [{ type: string }, { type: integer }] } }
              msg: { type: string }
              type: { type: string }
